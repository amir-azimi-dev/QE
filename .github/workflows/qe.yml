- name: Fix pseudopotential paths
  shell: bash
  run: |
    set -e

    for d in bot top; do
      # Inputs directly inside bot/ or top/
      for f in "$d"/*.in; do
        [ -f "$f" ] || continue
        sed -i 's|/home/microlab/Rajabi/psuedo|./dos/pseudo|g' "$f"
      done

      # Inputs inside bot/dos/ or top/dos/
      for f in "$d"/dos/*.in; do
        [ -f "$f" ] || continue
        sed -i 's|/home/microlab/Rajabi/psuedo|./pseudo|g' "$f"
      done
    done

    echo "Updated pseudopotential paths:"
    grep -nH 'pseudo_dir' bot/*.in top/*.in bot/dos/*.in top/dos/*.in
