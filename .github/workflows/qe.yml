name: Quantum ESPRESSO - In2Se3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calculate:
    name: Calculate ${{ matrix.structure }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix:
        structure:
          - bot
          - top

    env:
      OMP_NUM_THREADS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore previous QE data
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ matrix.structure }}/tmp/
            ${{ matrix.structure }}/dos/tmp/
          key: qe-${{ matrix.structure }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            qe-${{ matrix.structure }}-${{ github.ref_name }}-

      - name: Install Quantum ESPRESSO and Gnuplot
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y quantum-espresso gnuplot

      - name: Select MPI process count
        shell: bash
        run: |
          set -euo pipefail

          NPROC=$(nproc)
          if [ -z "$NPROC" ] || [ "$NPROC" -lt 1 ]; then
            NPROC=1
          fi

          echo "MPI_NPROC=$NPROC" >> "$GITHUB_ENV"
          echo "Available processors: $NPROC"
          mpirun --version

      - name: Fix pseudopotential paths
        shell: bash
        run: |
          set -euo pipefail

          for d in bot top; do
            # Input files in bot/ or top/
            for f in "$d"/*.in; do
              [ -f "$f" ] || continue
              sed -i -E \
                "s|^[[:space:]]*pseudo_dir[[:space:]]*=.*|    pseudo_dir = './dos/pseudo/',|" \
                "$f"
            done

            # Input files in bot/dos/ or top/dos/
            for f in "$d"/dos/*.in; do
              [ -f "$f" ] || continue
              sed -i -E \
                "s|^[[:space:]]*pseudo_dir[[:space:]]*=.*|    pseudo_dir = './pseudo/',|" \
                "$f"
            done
          done

          echo "Checking pseudopotential paths:"
          grep -nH -i 'pseudo_dir' \
            bot/*.in top/*.in \
            bot/dos/*.in top/dos/*.in

          echo "Checking pseudopotential files:"
          for d in bot top; do
            for p in In.pbe-dn-kjpaw_psl.1.0.0.UPF Se.pbe-dn-kjpaw_psl.1.0.0.UPF; do
              test -s "$d/dos/pseudo/$p" || {
                echo "ERROR: Missing pseudopotential: $d/dos/pseudo/$p"
                exit 1
              }
            done
          done

      - name: Patch MPI commands and stop scripts on errors
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            bot/run.sh \
            top/run.sh \
            bot/dos/run.sh \
            top/dos/run.sh
          do
            [ -f "$f" ] || continue

            # Stop on command failures, including commands piped to tee.
            if ! grep -q 'set -euo pipefail' "$f"; then
              if head -n 1 "$f" | grep -q '^#!'; then
                sed -i '2i set -euo pipefail' "$f"
              else
                sed -i '1i set -euo pipefail' "$f"
              fi
            fi

            # Replace existing MPI process counts.
            sed -i -E \
              "s/mpirun[[:space:]]+-np[[:space:]]+[0-9]+/mpirun --oversubscribe -np ${MPI_NPROC}/g" \
              "$f"
          done

          echo "MPI commands after patching:"
          grep -nH 'mpirun' \
            bot/run.sh top/run.sh \
            bot/dos/run.sh top/dos/run.sh

      - name: Fix DOS plotting scripts
        shell: bash
        run: |
          set -euo pipefail

          for f in bot/dos/run.sh top/dos/run.sh; do
            [ -f "$f" ] || continue

            # Remove the previous plotting block, if present.
            sed -i '/^[[:space:]]*plot[[:space:]]*\[/,$d' "$f"

            cat >> "$f" <<'SCRIPT'

          # Plot projected DOS using generated PDOS files.
          shopt -s nullglob
          pdos_files=( *.pdos_atm#*_wfc#* )

          if ((${#pdos_files[@]})); then
            if [ ! -s mx.scf.out ]; then
              echo "ERROR: mx.scf.out is missing or empty."
              exit 1
            fi

            FERMI=$(awk '
              /the Fermi energy is/ {
                for (i=1; i<=NF; i++) {
                  if ($i == "is") {
                    value=$(i+1)
                    gsub(/[,;]/, "", value)
                    fermi=value
                  }
                }
              }
              END {
                if (fermi != "") print fermi
              }
            ' mx.scf.out)

            if [ -z "$FERMI" ]; then
              FERMI=$(awk '
                /highest occupied level/ {
                  for (i=1; i<=NF; i++) {
                    if ($i == "level") {
                      value=$(i+1)
                      gsub(/[,;]/, "", value)
                      level=value
                    }
                  }
                }
                END {
                  if (level != "") print level
                }
              ' mx.scf.out)
            fi

            if [ -z "$FERMI" ]; then
              echo "ERROR: Could not find the Fermi energy or highest occupied level in mx.scf.out"
              exit 1
            fi

            echo "Energy reference for DOS plots: $FERMI eV"

            {
              cat <<'GPLOT'
          set terminal pngcairo size 1200,800
          set xlabel "Energy (eV)"
          set ylabel "Projected DOS"
          set grid
          set output "pdos.png"
          GPLOT

              printf 'plot [-1.50:4.50] '
              sep=''
              for file in "${pdos_files[@]}"; do
                printf "%s'%s' using 1:2 with lines title '%s'" \
                  "$sep" "$file" "$file"
                sep=', '
              done
              printf '\n'

              cat <<'GPLOT'
          set output "pdos_shifted.png"
          GPLOT

              printf 'plot [-3.0:3.0] '
              sep=''
              for file in "${pdos_files[@]}"; do
                printf "%s'%s' using (\$1-(%s)):2 with lines title '%s'" \
                  "$sep" "$file" "$FERMI" "$file"
                sep=', '
              done
              printf '\n'
            } | gnuplot

          else
            echo "No PDOS files found; skipping DOS plots."
          fi
          SCRIPT
          done

      - name: Run structural relaxation, SCF and band calculations
        shell: bash
        working-directory: ${{ matrix.structure }}
        run: |
          set -euo pipefail

          echo "Running calculations for ${{ matrix.structure }}"
          bash run.sh
          bash bandgap.sh

      - name: Run DOS calculations
        shell: bash
        working-directory: ${{ matrix.structure }}/dos
        run: |
          set -euo pipefail
          bash run.sh

      - name: Upload calculation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qe-results-${{ matrix.structure }}
          path: |
            ${{ matrix.structure }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Save QE restart data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ matrix.structure }}/tmp/
            ${{ matrix.structure }}/dos/tmp/
          key: qe-${{ matrix.structure }}-${{ github.ref_name }}-${{ github.run_id }}
